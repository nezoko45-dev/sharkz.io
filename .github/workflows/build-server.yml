name: Build Sharkz Server EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.js'
      - 'package.json'
      - 'index.html'
      - 'Game.js'
      - 'style.css'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.gif'
      - '*.svg'
      - 'start-sharkz.bat'
      - '.github/workflows/build-server.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build SharkzServer.exe
        run: npx @yao-pkg/pkg server.js --targets node22-win-x64 --output SharkzServer.exe

      - name: Package complete Windows bundle
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Include the generated server under both names so the ZIP always
          # contains the requested server.exe without requiring an upload.
          Copy-Item SharkzServer.exe dist/SharkzServer.exe -Force
          Copy-Item SharkzServer.exe dist/server.exe -Force

          Copy-Item index.html dist/index.html -Force
          Copy-Item Game.js dist/Game.js -Force
          Copy-Item style.css dist/style.css -Force
          Copy-Item server.js dist/server.js -Force
          Copy-Item package.json dist/package.json -Force
          Copy-Item start-sharkz.bat dist/start-sharkz.bat -Force

          Get-ChildItem -File | Where-Object {
            $_.Extension.ToLowerInvariant() -in @('.jpg','.jpeg','.png','.webp','.gif','.svg')
          } | ForEach-Object {
            Copy-Item $_.FullName dist/ -Force
          }

          @'
          SHARKZ.IO WINDOWS MULTIPLAYER

          Easiest way to play:
          1. Double-click start-sharkz.bat.
          2. The Sharkz server starts automatically.
          3. Your browser opens http://localhost:3000

          You can also run server.exe directly and then open:
          http://localhost:3000

          SharkzServer.exe is included as the original generated server name.
          server.exe is included as the simple server launcher name.

          LAN players can use:
          http://YOUR-PC-IP:3000
          '@ | Set-Content dist/README.txt -Encoding UTF8

          Write-Host 'Final ZIP contents:'
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Create complete ZIP
        shell: pwsh
        run: |
          if (Test-Path SharkzServer-Windows.zip) { Remove-Item SharkzServer-Windows.zip -Force }
          Compress-Archive -Path dist/* -DestinationPath SharkzServer-Windows.zip -CompressionLevel Optimal
          if (!(Test-Path SharkzServer-Windows.zip)) { throw 'ZIP was not created.' }

      - name: Upload complete Sharkz bundle
        uses: actions/upload-artifact@v4
        with:
          name: SharkzServer-Windows
          path: SharkzServer-Windows.zip
          if-no-files-found: error
          retention-days: 14
